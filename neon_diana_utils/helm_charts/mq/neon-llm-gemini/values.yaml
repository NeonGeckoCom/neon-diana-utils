serviceName: backend-llm-gemini
replicaCount: 1
configSecrets:
  - diana-config
  - google-json
image:
  repository: ghcr.io/neongeckocom/neon-llm-gemini
  pullPolicy: Always
  tag: dev
resources:
  requests:
    memory: "600Mi"
    cpu: "0.01"
livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /status
    port: 8000
    scheme: HTTP
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

