serviceName: backend-mq-metrics
replicaCount: 1
configSecret: diana-config
image:
  repository: ghcr.io/neongeckocom/neon_metrics_service
  pullPolicy: Always
  tag: dev
persistentVolumeClaim:
  name: metrics
  claimName: metrics
  containerPath: /data
resources:
  requests:
    memory: "50Mi"
    cpu: "0.01"
livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /status
    port: 8000
    scheme: HTTP
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

