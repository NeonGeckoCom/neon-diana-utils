serviceName: neon-core-skills
replicaCount: 1
configMap: neon-config
image:
  repository: ghcr.io/neongeckocom/neon_skills-default_skills
  pullPolicy: Always
  tag: dev
resources:
  requests:
    memory: "850Mi"
    cpu: "0.1"
livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /status
    port: 8000
    scheme: HTTP
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1
