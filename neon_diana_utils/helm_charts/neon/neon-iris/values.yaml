serviceName: neon-core-iris
domain: diana.local
replicaCount: 1
configMap: neon-config

port:
  name: web-ui
  number: 7860
  targetPort: 7860
image:
  repository: ghcr.io/neongeckocom/neon-iris
  pullPolicy: Always
  tag: dev
resources:
  requests:
    memory: "500Mi"
    cpu: "0.05"
ingress:
  enabled: True
  ingressClassName: nginx
  tlsSecretName: tls-letsencrypt-iris
  certIssuer: letsencrypt-private-key
  rules:
    - host: iris
      serviceName: neon-core-iris
      servicePort: 7860
livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /status
    port: 7860
    scheme: HTTP
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1
startupProbe:
  failureThreshold: 30
  httpGet:
    path: /status
    port: 8000
    scheme: HTTP
  periodSeconds: 15
  successThreshold: 1
  timeoutSeconds: 1
